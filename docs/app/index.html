<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gennemført</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='5' fill='%23e8a317'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%23111' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e12; --panel:#13161c; --panel2:#181c24; --line:#252b36; --ink:#eef1f5; --ink2:#aab3c0; --ink3:#738093;
  --accent:#f0b429; --ok:#22c55e; --dev:#f0a020; --bad:#ef4444; --other:#7c8cf0; --miss:#9aa1ab;
  --shadow:0 10px 30px rgba(0,0,0,.35); --viewer:#0a0c10;
}
:root[data-theme="light"]{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#f7f8fa; --line:#e2e5ea; --ink:#111827; --ink2:#4b5563; --ink3:#6b7280;
  --accent:#b7791f; --ok:#16a34a; --dev:#d97706; --bad:#dc2626; --other:#4f5bd5; --miss:#6b7280; --shadow:0 8px 24px rgba(15,23,42,.08); --viewer:#e9ecf1;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#f7f8fa; --line:#e2e5ea; --ink:#111827; --ink2:#4b5563; --ink3:#6b7280;
    --accent:#b7791f; --ok:#16a34a; --dev:#d97706; --bad:#dc2626; --other:#4f5bd5; --miss:#6b7280; --shadow:0 8px 24px rgba(15,23,42,.08); --viewer:#e9ecf1;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",Consolas,monospace}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:inline-grid;place-items:center}
.brand i::after{content:"";width:11px;height:11px;border-radius:50%;border:3px solid #111}
.proj{color:var(--ink2);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:999px;padding:5px 11px;font:600 12.5px Inter,sans-serif;cursor:pointer}
.chip b{font-size:14px}
.chip .d{width:9px;height:9px;border-radius:50%}
.chip.on{outline:2px solid var(--ink3)}
.iconbtn{border:1px solid var(--line);background:var(--panel2);color:var(--ink2);border-radius:8px;height:32px;padding:0 10px;cursor:pointer;font:500 12.5px Inter,sans-serif}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(380px,1fr);height:calc(100vh - 57px)}
#viewer{position:relative;background:var(--viewer);overflow:hidden}
#viewer canvas{display:block;width:100%;height:100%}
.vbar{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--ink2);padding:5px 10px;border-radius:6px;font:600 12px Inter,sans-serif;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.legend{position:absolute;left:12px;bottom:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink2);display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.ln{width:14px;height:3px;border-radius:2px}
.tag{position:absolute;right:12px;top:12px;font-size:11.5px;color:var(--ink3);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:4px 9px;border-radius:7px;border:1px solid var(--line)}
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--ink2);padding:11px 6px;font:600 13px Inter,sans-serif;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.pane{overflow:auto;flex:1;min-height:0;padding:12px 14px 30px}
.pane[hidden]{display:none}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:var(--panel2)}
.row:hover{border-color:var(--ink3)}
.row.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.row .id{font:600 12px "JetBrains Mono",monospace;color:var(--ink2)}
.row .t{font-weight:600;font-size:13px;line-height:1.3}
.row .s{font-size:12px;color:var(--ink3)}
.badge{display:inline-flex;align-items:center;gap:6px;font:700 11.5px Inter,sans-serif;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters select,.filters input{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 8px;font:13px Inter,sans-serif}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:14px;margin-top:4px}
.card h2{margin:6px 0 2px;font-size:18px;letter-spacing:-.01em}
.card .sub{color:var(--ink2);font-size:13px}
.sec{margin-top:14px}
.sec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px}
.sol{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel)}
.sol .ref{font:600 12.5px "JetBrains Mono",monospace;color:var(--accent)}
.etaimg{position:relative;margin-top:8px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
.etaimg img{display:block;width:100%}
.etaimg .hl{position:absolute;left:0;right:0;background:rgba(240,180,41,.28);outline:2px solid #f0a020;pointer-events:none}
.etaimg .cap{position:absolute;right:6px;top:6px;font:600 11px Inter,sans-serif;background:rgba(17,24,39,.82);color:#fff;padding:2px 7px;border-radius:5px}
table.chk{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
table.chk td,table.chk th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.chk th{color:var(--ink3);font-weight:600;font-size:11.5px}
table.chk td.ok{color:var(--ok);font-weight:700}
table.chk td.no{color:var(--dev);font-weight:700}
table.chk tr.bad td{background:color-mix(in srgb,var(--dev) 9%,transparent)}
.note{font-size:11.5px;color:var(--ink3)}
ul.cond{margin:4px 0 0;padding-left:18px;color:var(--ink2);font-size:12.5px}
ul.cond li{margin-bottom:3px}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 11px;border-radius:8px;font:600 12.5px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#111}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
.form select,.form input{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 8px;font:13px Inter,sans-serif}
.form .full{grid-column:1/-1}
.hint{font-size:12px;color:var(--ink3);margin:8px 0 0}
.disc{font-size:11.5px;color:var(--ink3);margin-top:14px;border-top:1px dashed var(--line);padding-top:8px}
.etarow{display:grid;grid-template-columns:54px 1fr auto;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
.etarow:hover{background:var(--panel2)}
.etarow .sct{font:600 11.5px "JetBrains Mono",monospace;color:var(--accent)}
.empty{color:var(--ink3);padding:20px 4px}
@media (max-width:900px){
  main{grid-template-columns:1fr;height:auto}
  #viewer{height:46vh}
  aside{border-left:0;border-top:1px solid var(--line)}
  .pane{max-height:none}
  .chips{margin-left:0}
  .form{grid-template-columns:1fr}
  .legend{display:none}
  header{position:static}
  .chip{padding:4px 9px;font-size:12px}
  .proj{font-size:12px}
  #viewer{height:40vh}
}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>Gennemført</div>
  <div class="proj" id="proj"></div>
  <div class="chips" id="chips"></div>
  <button class="iconbtn" id="theme" title="Lys/mørk">◐</button>
</header>
<main>
  <section id="viewer">
    <div class="vbar">
      <div class="seg" id="storeys"></div>
      <div class="seg"><button id="explode">Adskil etager</button></div>
    </div>
    <div class="tag">Demonstrationsbygning · ETA-21/0110</div>
    <div class="legend" id="legend"></div>
  </section>
  <aside>
    <div class="tabs">
      <button data-tab="reg" class="on">Register</button>
      <button data-tab="chk">Tjek en gennemføring</button>
      <button data-tab="eta">ETA-database</button>
    </div>
    <div class="pane" id="pane-reg">
      <div class="filters">
        <select id="fStatus"><option value="">Alle statusser</option></select>
        <select id="fStorey"><option value="">Alle etager</option></select>
        <input id="fText" placeholder="Søg (fx PVC, G-ST-04)" size="16">
      </div>
      <div id="detail"></div>
      <div id="list"></div>
    </div>
    <div class="pane" id="pane-chk" hidden>
      <div class="form" id="form"></div>
      <p class="hint">Samme regler som registeret, kørt i browseren. Resultatet viser den ETA-række, det bygger på.</p>
      <div id="chkres"></div>
    </div>
    <div class="pane" id="pane-eta" hidden>
      <div class="filters"><input id="etaq" placeholder="Søg i testede opbygninger (fx copper, 110, Kaiflex)" style="flex:1"></div>
      <div id="etainfo" class="note"></div>
      <div id="etaview"></div>
      <div id="etalist"></div>
    </div>
  </aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="engine.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COL = {TESTET:'--ok', AFVIGELSE:'--dev', IKKE_DAEKKET:'--bad', ANDET_SYSTEM:'--other', MANGLER_DATA:'--miss'};
const ORDER = ['TESTET','AFVIGELSE','IKKE_DAEKKET','ANDET_SYSTEM','MANGLER_DATA'];
const STOREYS = [['','Alle'],['Kælder','K'],['Stueetage','ST'],['1. sal','1'],['2. sal','2']];
const CODE = {'Kælder':'K','Stueetage':'ST','1. sal':'1','2. sal':'2'};
const HOST = {rigid_wall:'Massiv væg', flexible_wall:'Let væg', rigid_floor:'Massivt dæk'};
const SYS = {DRAINAGE:['Afløb','#9b8a74'], DOMESTICCOLDWATER:['Brugsvand koldt','#3b82f6'], DOMESTICHOTWATER:['Brugsvand varmt','#ef4444'],
             HEATING:['Varme','#f97316'], VENTILATION:['Ventilation','#a3aab5'], ELECTRICAL:['El','#eab308']};
let S, REG, RECS, sel = null, filt = {status:'', storey:'', text:''}, storey = '', exploded = false;
const T = {}; // three
try { const t = localStorage.getItem('gf-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$('#theme').onclick = () => { const r = document.documentElement; const dark = css('--bg') === '#0c0e12'; r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('gf-theme', r.dataset.theme); } catch (e) {} recolor(); };

const badge = st => `<span class="badge" style="background:var(${COL[st]})">${esc(S.short[st])}</span>`;

Promise.all(['data/summary.json','data/register.json','data/records.json'].map(u => fetch(u).then(r => r.json()))).then(([s, r, recs]) => {
  S = s; REG = r; RECS = recs; GEngine.load(recs);
  $('#proj').textContent = `${S.project} · ${S.count} gennemføringer · ETA-database: ${S.eta.records} testede opbygninger`;
  chips(); filters(); list(); form(); etaList(''); initThree(); route();
  window.addEventListener('hashchange', route);
});

function chips() {
  const c = S.status;
  $('#chips').innerHTML = ORDER.map(st => `<button class="chip" data-st="${st}"><span class="d" style="background:var(${COL[st]})"></span><b>${c[st]||0}</b>${esc(S.short[st])}</button>`).join('')
    + `<a class="chip" href="downloads/Gennemfoeringsregister.pdf" target="_blank">Register PDF</a><a class="chip" href="downloads/Gennemfoeringsregister.xlsx">Excel</a>`;
  $('#chips').querySelectorAll('button').forEach(b => b.onclick = () => { filt.status = filt.status === b.dataset.st ? '' : b.dataset.st;
    $('#fStatus').value = filt.status; tab('reg'); list(); paintMarkers(); });
}
function filters() {
  $('#fStatus').innerHTML += ORDER.map(s => `<option value="${s}">${esc(S.labels[s])}</option>`).join('');
  $('#fStorey').innerHTML += STOREYS.slice(1).map(([v]) => `<option>${v}</option>`).join('');
  $('#fStatus').onchange = e => { filt.status = e.target.value; list(); paintMarkers(); };
  $('#fStorey').onchange = e => { setStorey(e.target.value); };
  $('#fText').oninput = e => { filt.text = e.target.value.toLowerCase(); list(); };
  $('#storeys').innerHTML = STOREYS.map(([v, l]) => `<button data-v="${v}" class="${v===''?'on':''}">${l}</button>`).join('');
  $('#storeys').querySelectorAll('button').forEach(b => b.onclick = () => setStorey(b.dataset.v));
  $('#explode').onclick = () => { exploded = !exploded; $('#explode').classList.toggle('on', exploded); layout(); };
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => tab(b.dataset.tab));
  $('#legend').innerHTML = ORDER.map(st => `<span><i style="background:var(${COL[st]})"></i>${esc(S.short[st])}</span>`).join('')
    + Object.values(SYS).map(([n, c]) => `<span><i class="ln" style="background:${c}"></i>${n}</span>`).join('');
}
function tab(t) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  ['reg','chk','eta'].forEach(k => $('#pane-' + k).hidden = k !== t);
}
function setStorey(v) {
  storey = v; filt.storey = v; $('#fStorey').value = v;
  $('#storeys').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  list(); layout();
}
function shown(p) {
  if (filt.status && p.status !== filt.status) return false;
  if (filt.storey && p.storey !== filt.storey) return false;
  if (filt.text && !(p.id + ' ' + p.service.line + ' ' + p.host.name).toLowerCase().includes(filt.text)) return false;
  return true;
}
function list() {
  const rows = REG.filter(shown);
  $('#list').innerHTML = rows.length ? rows.map(p => `<div class="row ${sel && sel.id===p.id?'sel':''}" data-id="${p.id}">
      <div class="id">${p.id}</div><div><div class="t">${esc(p.service.line)}</div><div class="s">${esc(HOST[p.host.kind])} ${p.host.thickness_mm} mm · ${esc(p.host.rating)} · ${esc(p.storey)}</div></div>${badge(p.status)}</div>`).join('')
    : '<div class="empty">Ingen gennemføringer med dette filter.</div>';
  $('#list').querySelectorAll('.row').forEach(r => r.onclick = () => { location.hash = r.dataset.id; });
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const p = REG && REG.find(x => x.id === id);
  if (p) select(p, true);
}
function select(p, fly) {
  sel = p; tab('reg');
  $('#detail').innerHTML = cardHTML(p.id + ' · ' + p.service.line, `${HOST[p.host.kind]} ${p.host.thickness_mm} mm (${esc(p.host.name)}) · krav ${esc(p.host.rating)} · ${esc(p.storey)}`, p, p.draft);
  wireCard($('#detail'));
  list(); paintMarkers();
  if (fly) flyTo(p);
  $('#pane-reg').scrollTop = 0;
  if (innerWidth < 900 && fly) document.querySelector('#detail').scrollIntoView();
}
function etaImg(ref) {
  const m = S.eta.pages[ref.page]; if (!m) return '';
  let hl = '';
  if (ref.row_bbox) {
    const top = (ref.row_bbox[1] - m.y0) / m.h * 100, h = (ref.row_bbox[3] - ref.row_bbox[1]) / m.h * 100;
    hl = `<div class="hl" style="top:${top}%;height:${h}%"></div>`;
  }
  return `<div class="etaimg"><img src="data/eta/p${ref.page}.jpg" alt="ETA-21/0110 side ${ref.page}">${hl}<span class="cap">${esc(ref.eta)} · ${esc(ref.section)} · side ${ref.page}</span></div>`;
}
function checksHTML(ref) {
  return `<table class="chk"><tr><th>Parameter</th><th>Projekteret</th><th>Testet</th><th></th></tr>` + ref.checks.map(c =>
    `<tr class="${c.ok?'':'bad'}"><td>${esc(c.c)}</td><td>${esc(c.a)}</td><td>${esc(c.t)}${c.n?`<div class="note">${esc(c.n)}</div>`:''}</td><td class="${c.ok?'ok':'no'}">${c.ok?'✓':'✗'}</td></tr>`).join('') + '</table>';
}
function refHTML(ref, title) {
  return `<div class="sec"><h3>${title}</h3><div class="sol"><div class="ref">${esc(ref.eta)} ${esc(ref.section)} · side ${ref.page}${ref.source==='override'?' · rækken er indtastet og kontrolleret manuelt':''}</div>
    <div style="margin-top:4px"><b>${esc(ref.service.text)}</b></div>
    <div class="sub">${esc(ref.classification.text)} · ${esc(ref.insulation.text)}${ref.board?' · Multimastic '+esc(ref.board):''}${ref.wrap?' · Multiwrap '+esc(ref.wrap):''}</div>
    ${etaImg(ref)}${checksHTML(ref)}</div></div>`;
}
function cardHTML(title, sub, v, draft) {
  let h = `<div class="card">${badge(v.status)}<h2>${esc(title)}</h2><div class="sub">${sub}</div>
    <div class="sec"><h3>Handling</h3><div>${esc(S.actions[v.status])}</div></div>`;
  if (v.matches && v.matches.length) h += refHTML(v.matches[0], v.matches.length > 1 ? `Testet løsning (1 af ${v.matches.length} der passer)` : 'Testet løsning');
  if (v.nearest && v.nearest.length) h += refHTML(v.nearest[0], v.status === 'AFVIGELSE' ? 'Nærmeste testede opbygning: afviger på ' + esc(v.nearest[0].deviates.join(', ')) : 'Nærmeste i samme konstruktion');
  if (v.alternatives && v.alternatives.length) {
    const a = v.alternatives[0];
    h += `<div class="sec"><h3>Testet alternativ</h3><div class="sol"><div class="ref">${esc(a.eta)} ${esc(a.section)} · side ${a.page}</div>
      <div>${esc(a.service.text)} · ${esc(a.insulation.text)} · <b>${esc(a.classification.text)}</b>${a.board?' · Multimastic '+esc(a.board):''}</div>
      <div class="note">Kræver ændring af: ${esc(a.deviates.join(', '))}</div></div></div>`;
  }
  if (v.questions && v.questions.length) h += `<div class="sec"><h3>Spørgsmål til projekterende</h3><ul class="cond">${v.questions.map(q => `<li>${esc(q)}</li>`).join('')}</ul></div>`;
  if (v.conditions && v.conditions.length) h += `<div class="sec"><h3>Betingelser og noter</h3><ul class="cond">${v.conditions.map(q => `<li>${esc(q)}</li>`).join('')}</ul></div>`;
  h += `<div class="act">${draft ? `<a class="btn pri" href="downloads/vurderinger/${encodeURIComponent(draft)}">Udkast til brandteknisk vurdering (.docx)</a>` : ''}
    ${v.matches && v.matches.length ? '' : '<a class="btn" href="downloads/Gennemfoert_afvigelser.bcfzip">BCF-sager</a>'}</div>
    <div class="disc">${esc(S.disclaimer)}</div></div>`;
  return h;
}
function wireCard() {}

/* ---------------- checker ---------------- */
function form() {
  const f = [
    ['host_kind', 'Konstruktion', 'select', [['rigid_floor','Massivt dæk (beton/letbeton)'],['rigid_wall','Massiv væg (beton/murværk)'],['flexible_wall','Let væg (gips på stålskelet)']]],
    ['thickness_mm', 'Tykkelse (mm)', 'number', 200], ['ei_required', 'Krav (EI, min.)', 'select', [['30','EI 30'],['45','EI 45'],['60','EI 60'],['90','EI 90'],['120','EI 120']], '60'],
    ['service_kind', 'Installation', 'select', [['pipe','Rør'],['cable','Kabel'],['cable_bundle','Kabelbundt'],['cable_tray','Kabelbakke'],['duct','Ventilationskanal']]],
    ['material', 'Materiale', 'select', [['pvc-u','PVC-U'],['pp','PP'],['pe','PE'],['copper','Kobber'],['steel','Stål'],['composite','Alupex (PEX-AL-PEX)']]],
    ['od_mm', 'Udv. diameter (mm)', 'number', 110], ['wall_mm', 'Godstykkelse (mm)', 'number', 3.4],
    ['open_system', 'System', 'select', [['1','Åbent (afløb)'],['0','Lukket (brugsvand, varme)']]],
    ['ins_type', 'Isolering', 'select', [['none','Ingen'],['stone_wool','Stenuld'],['elastomeric','Elastomer (cellegummi)']]],
    ['ins_t', 'Isoleringstykkelse (mm)', 'number', ''], ['ins_p', 'Isoleringsfabrikat', 'select', [['','–'],['Kaiflex ST','Kaiflex ST'],['Armaflex AF','Armaflex AF'],['Stenuld rørskål','Stenuld rørskål']]],
    ['bundle_mm', 'Bundtdiameter (mm)', 'number', ''], ['aperture', 'Hul (mm, fx 200x200)', 'text', '220x220']];
  $('#form').innerHTML = f.map(([k, l, t, o, d]) => t === 'select'
    ? `<label>${l}<select id="q_${k}">${o.map(([v, n]) => `<option value="${v}" ${v===d?'selected':''}>${n}</option>`).join('')}</select></label>`
    : `<label>${l}<input id="q_${k}" type="${t}" value="${o}" ${t==='number'?'step="any"':''}></label>`).join('');
  $('#form').querySelectorAll('select,input').forEach(e => e.oninput = runCheck);
  runCheck();
}
function runCheck() {
  const g = k => $('#q_' + k).value, n = k => g(k) === '' ? null : +g(k);
  const kind = g('service_kind');
  const q = {host_kind: g('host_kind'), thickness_mm: n('thickness_mm'), ei_required: n('ei_required'), service_kind: kind,
    material: kind === 'pipe' ? g('material') : null, od_mm: n('od_mm'), wall_mm: kind === 'pipe' ? n('wall_mm') : null,
    bundle_mm: n('bundle_mm'), open_system: kind === 'pipe' ? g('open_system') === '1' : null,
    insulation: g('ins_type') === 'none' ? {type:'none'} : {type: g('ins_type'), thickness_mm: n('ins_t'), product: g('ins_p') || null},
    hollow_core: false};
  const ap = (g('aperture') || '').match(/(\d+)\s*[x×]\s*(\d+)/);
  if (ap) { q.aperture_mm = [+ap[1], +ap[2]]; const tot = (q.od_mm || 0) + 2 * ((q.insulation.thickness_mm) || 0); q.edge_mm = Math.round((Math.min(q.aperture_mm[0], q.aperture_mm[1]) - tot) / 2);
    q.fill = Math.round(Math.PI * tot * tot / 4 / (q.aperture_mm[0] * q.aperture_mm[1]) * 1000) / 1000; }
  const v = GEngine.evaluate(q);
  window.lastCheck = {q, v};
  $('#chkres').innerHTML = cardHTML('Resultat', `${HOST[q.host_kind]} ${q.thickness_mm} mm · krav EI ${q.ei_required}`, v, null);
}

/* ---------------- ETA database ---------------- */
function etaList(qs) {
  const q = qs.toLowerCase();
  const rows = RECS.filter(r => !q || (r.section + ' ' + r.service.text + ' ' + r.classification.text + ' ' + r.insulation.text + ' ' + r.heading).toLowerCase().includes(q)).slice(0, 200);
  $('#etainfo').textContent = `${S.eta.id} · ${S.eta.product} · ${S.eta.records} testede opbygninger i ${S.eta.sections} tabeller. Viser ${rows.length}.`;
  $('#etalist').innerHTML = rows.map(r => `<div class="etarow" data-id="${esc(r.id)}"><span class="sct">${esc(r.section)}</span><span>${esc(r.service.text)}<div class="note">${esc(r.insulation.text)} · ${esc(r.heading)}</div></span><span><b>${esc(r.classification.text)}</b></span></div>`).join('');
  $('#etalist').querySelectorAll('.etarow').forEach(e => e.onclick = () => {
    const r = RECS.find(x => x.id === e.dataset.id);
    $('#etaview').innerHTML = `<div class="sol" style="margin-bottom:10px"><div class="ref">${esc(r.eta)} ${esc(r.section)} · side ${r.page}</div><div>${esc(r.heading)}</div>${etaImg(r)}</div>`;
    $('#pane-eta').scrollTop = 0;
  });
}
$('#etaq') && ($('#etaq').oninput = e => etaList(e.target.value));

/* ---------------- 3D ---------------- */
function initThree() {
  const el = $('#viewer');
  const r = T.renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
  r.setPixelRatio(Math.min(2, devicePixelRatio)); el.appendChild(r.domElement);
  T.scene = new THREE.Scene();
  T.camera = new THREE.PerspectiveCamera(38, 1, 0.1, 500);
  T.camera.position.set(32, 26, 40);
  T.controls = new THREE.OrbitControls(T.camera, r.domElement); T.controls.enableDamping = true; T.controls.target.set(18, 2, -6);
  T.scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.15));
  const d = new THREE.DirectionalLight(0xffffff, 0.9); d.position.set(20, 40, 10); T.scene.add(d);
  const d2 = new THREE.DirectionalLight(0xffffff, 0.35); d2.position.set(-20, 10, -30); T.scene.add(d2);
  T.root = new THREE.Group(); T.root.rotation.x = -Math.PI / 2; T.scene.add(T.root);
  T.markers = [];
  new THREE.GLTFLoader().load('building.glb', g => {
    T.model = g.scene; T.root.add(T.model);
    const edges = [];
    T.model.traverse(o => { if (o.isMesh) { o.userData.key = (o.name || o.parent.name).replace(/_\d+$/, '');
      o.geometry.computeVertexNormals();
      if (o.userData.key.startsWith('H_')) edges.push(o); } });
    edges.forEach(o => { const l = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 25),
      new THREE.LineBasicMaterial({transparent: true, opacity: 0.5, depthWrite: false})); l.userData.edge = true; o.add(l); });
    recolor(); buildMarkers(); layout(); resize(); fit(); window.G.ready = true;
  });
  window.addEventListener('resize', resize);
  r.domElement.addEventListener('pointerdown', e => { T.down = [e.clientX, e.clientY]; });
  r.domElement.addEventListener('pointerup', e => { if (!T.down || Math.hypot(e.clientX - T.down[0], e.clientY - T.down[1]) > 4) return; pick(e); });
  (function loop(t) { requestAnimationFrame(loop); if (window.G && window.G.frozen) return; T.controls.update(); pulse(t); r.render(T.scene, T.camera); })(0);
}
function resize() {
  const el = $('#viewer'), w = el.clientWidth, h = el.clientHeight;
  T.renderer.setSize(w, h); T.camera.aspect = w / h; T.camera.updateProjectionMatrix();
}
function matFor(key) {
  const dark = css('--bg') === '#0c0e12';
  if (key.startsWith('H_')) {
    const rated = key.endsWith('_r'), slab = key.includes('_slab'), light = key.includes('_light');
    const c = !rated ? (dark ? 0x3a4250 : 0xb8bec8) : slab ? (dark ? 0x6a7386 : 0x9aa3b2) : light ? 0x7aa2d6 : 0xd08a5a;
    return new THREE.MeshStandardMaterial({color: c, transparent: true, opacity: slab ? 0.16 : rated ? (dark ? 0.26 : 0.22) : 0.06, depthWrite: false,
      roughness: 0.9, side: THREE.DoubleSide});
  }
  if (key.startsWith('I_')) return new THREE.MeshStandardMaterial({color: dark ? 0xf1ece0 : 0xbfb6a2, transparent: true, opacity: 0.42, depthWrite: false, roughness: 1});
  const sys = key.split('_').slice(2).join('_');
  const col = new THREE.Color((SYS[sys] || ['', '#888'])[1]);
  return new THREE.MeshStandardMaterial({color: col, emissive: col.clone().multiplyScalar(dark ? 0.55 : 0.25), roughness: 0.5, metalness: 0.1,
    side: THREE.DoubleSide});
}
function recolor() {
  if (!T.model) return;
  const dark = css('--bg') === '#0c0e12';
  T.scene.background = new THREE.Color(css('--viewer'));
  T.model.traverse(o => {
    if (o.isMesh) { o.material = matFor(o.userData.key || ''); o.renderOrder = (o.userData.key || '').startsWith('H_') ? 2 : 1; }
    if (o.userData.edge) { const k = o.parent.userData.key || ''; const rated = k.endsWith('_r');
      o.material.color = new THREE.Color(rated ? (k.includes('_light') ? 0x8fb4e8 : k.includes('_slab') ? (dark ? 0x8a93a3 : 0x6b7280) : 0xe0a070) : (dark ? 0x4a5260 : 0xaab0ba));
      o.material.opacity = rated ? (dark ? 0.55 : 0.75) : 0.25; }
  });
  paintMarkers();
}
function fit() {
  const box = new THREE.Box3().setFromObject(T.model), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  T.home = {target: c.clone(), pos: c.clone().add(new THREE.Vector3(s.x * 0.55, s.y * 1.1, s.z * 2.1))};
  T.camera.position.copy(T.home.pos); T.controls.target.copy(T.home.target); T.controls.update();
}
function buildMarkers() {
  const ring = new THREE.TorusGeometry(1, 0.16, 12, 40);
  REG.forEach(p => {
    const a = p.aperture || [200, 200];
    const g = new THREE.Group();
    const r = Math.max(a[0], a[1]) / 2000 * 1.15;
    const m = new THREE.Mesh(ring, new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.95, depthTest: false}));
    m.scale.setScalar(r); m.renderOrder = 10;
    const halo = new THREE.Mesh(new THREE.CircleGeometry(1, 32), new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.18, depthTest: false, side: THREE.DoubleSide}));
    halo.scale.setScalar(r * 1.9); halo.renderOrder = 9;
    g.add(halo, m);
    g.position.set(...p.point);
    if (p.host.kind === 'rigid_floor') { /* ring lies in the deck: default torus is in XY plane (IFC plan) */ }
    else if (p.host.axis === 0) g.rotation.y = Math.PI / 2; else g.rotation.x = Math.PI / 2;
    g.userData = {p, ring: m, halo, base: p.point.slice()};
    T.root.add(g); T.markers.push(g);
  });
  paintMarkers();
}
function paintMarkers() {
  if (!T.markers) return;
  T.markers.forEach(g => {
    const p = g.userData.p, c = new THREE.Color(css(COL[p.status]));
    const vis = (!storey || p.storey === storey) && (!filt.status || p.status === filt.status);
    g.visible = vis;
    g.userData.ring.material.color = c; g.userData.halo.material.color = c;
    const s = sel && sel.id === p.id;
    g.userData.halo.material.opacity = s ? 0.55 : 0.18;
  });
}
function pulse(t) {
  if (!T.markers) return;
  T.markers.forEach(g => { const p = g.userData.p; if (p.status !== 'TESTET') { const k = 1 + 0.18 * Math.sin(t / 260 + g.position.x); g.userData.halo.scale.setScalar(g.userData.ring.scale.x * 1.9 * k); } });
}
function layout() {
  if (!T.model) return;
  const lift = c => exploded ? ({K: 0, ST: 2.4, 1: 4.8, 2: 7.2}[c] || 0) : 0;
  T.model.children.forEach(n => { const code = (n.name.split('_')[1]) || ''; n.visible = !storey || code === CODE[storey]; n.position.z = lift(code); });
  T.markers.forEach(g => { const c = CODE[g.userData.p.storey]; g.position.z = g.userData.base[2] + lift(c); });
  paintMarkers();
}
function flyTo(p) {
  const g = T.markers.find(m => m.userData.p.id === p.id); if (!g) return;
  const w = new THREE.Vector3(); g.getWorldPosition(w);
  const off = new THREE.Vector3(8.5, 6.5, 10.5);
  const from = T.camera.position.clone(), to = w.clone().add(off), tf = T.controls.target.clone();
  let k = 0; (function step() { k = Math.min(1, k + 0.06); const e = 1 - Math.pow(1 - k, 3);
    T.camera.position.lerpVectors(from, to, e); T.controls.target.lerpVectors(tf, w, e); if (k < 1) requestAnimationFrame(step); })();
}
function pick(e) {
  const rect = T.renderer.domElement.getBoundingClientRect();
  const m = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  const ray = new THREE.Raycaster(); ray.setFromCamera(m, T.camera);
  const hits = ray.intersectObjects(T.markers.filter(g => g.visible).map(g => g.userData.halo));
  if (hits.length) location.hash = hits[0].object.parent.userData.p.id;
}
window.G = {ready: false, select: id => { location.hash = id; }, setStorey, tab, explode: v => { exploded = v; layout(); },
  camera: (p, t) => { T.camera.position.set(...p); T.controls.target.set(...t); T.controls.update(); }, check: runCheck,
  setForm: o => { for (const [k, v] of Object.entries(o)) $('#q_' + k).value = v; runCheck(); }, filter: st => { filt.status = st; $('#fStatus').value = st; list(); paintMarkers(); }};
})();
